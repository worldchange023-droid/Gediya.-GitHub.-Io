<!DOCTYPE html>

</nav>
</header>

<section class="container" id="videos"></section>

<script>
const urlParams = new URLSearchParams(window.location.search);
const courseId = urlParams.get('id');

fetch('data/courses.json')
.then(res => res.json())
.then(courses => {
    const course = courses.find(c => c.id == courseId);
    const videosSection = document.getElementById('videos');

    if(course){
        videosSection.innerHTML = `<h2>${course.exam}</h2><p>${course.description}</p>`;
        if(course.videos.length > 0){
            course.videos.forEach(v => {
                videosSection.innerHTML += `
                <div class="video">
                    <h4>${v.title}</h4>
                    <iframe width="560" height="315" src="${v.url}" frameborder="0" allowfullscreen></iframe>
                </div>`;
            });
        } else {
            videosSection.innerHTML += "<p>No videos added yet.</p>";
        }
    } else {
        videosSection.innerHTML = "<p>Course not found.</p>";
    }
});
</script>

</body>
</html>
